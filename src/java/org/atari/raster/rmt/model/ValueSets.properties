# The display texts of this package's value sets, keyed <ClassName>_<id>.
# See ValueSets.java and plans/28_VALUE_SETS_PLAN.md.

# Assembler formats (the export dialogs' "Assembler format" combo box)
AssemblerFormat_ATASM=Atasm
AssemblerFormat_XASM=Xasm

# Tracker driver versions (the Options dialog's "RMT Driver Version" combo box).
# NONE and UNPATCHED_WITH_TUNING are not offered there, but are reachable
# through rmt.ini and the script command "set driver".
TrackerDriverVersion_NONE=None
TrackerDriverVersion_UNPATCHED=RMT 1.28 Unpatched by Raster
TrackerDriverVersion_UNPATCHED_WITH_TUNING=RMT 1.28 Unpatched by Raster with tuning
TrackerDriverVersion_PATCH3=RMT 1.25 Patch 3 by Analmux
TrackerDriverVersion_PATCH6=RMT 1.27 Patch 6 by Analmux
TrackerDriverVersion_PATCH8=RMT 1.28 Patch 8 by Analmux
TrackerDriverVersion_PATCH16=RMT 1.28 Patch 16 by VinsCool
TrackerDriverVersion_PATCH_PRINCE_OF_PERSIA=RMT 1.28 Patch Prince of Persia by VinsCool

# Keyboard layouts (the Options dialog's "Keyboard Layout" combo box)
KeyboardLayout_QWERTY=QWERTY Layout
KeyboardLayout_AZERTY=AZERTY Layout
KeyboardLayout_QWERTZ=QWERTZ Layout

# Tonics (the tuning dialog's "Tonic" combo box), in the stored
# number order of the C++ combo box, descending from C- (0) to C# (11).
Tonic_C=C-
Tonic_B=B-
Tonic_A_SHARP=A#
Tonic_A=A-
Tonic_G_SHARP=G#
Tonic_G=G-
Tonic_F_SHARP=F#
Tonic_F=F-
Tonic_E=E-
Tonic_D_SHARP=D#
Tonic_D=D-
Tonic_C_SHARP=C#

# Temperaments (the tuning dialog's "Temperament" combo box), in the stored
# number order of the C++ combo box: 0 equal, 1-28 the presets, 29 custom.
# The texts follow plan 59 step 3: name first, kind second, year last; each
# preset's values were verified against its Scala archive source file
# (huygens-fokker.org), listed in plans/59_TUNING_KEY_FIX_PLAN.md (step 3).
# The dialog shows them with Equal pinned first, Custom pinned last and the
# presets in between alphabetical (TuningDialog).
Temperament_EQUAL=Equal Temperament (Default)
Temperament_YOUNG_1799_NO1=Young Well Temperament No. 1 (1800)
Temperament_YOUNG_1799_NO2=Young Well Temperament No. 2 (1799)
Temperament_YOUNG_1807=Young Well Temperament (1807)
Temperament_WERCKMEISTER_III=Werckmeister III Well Temperament (1691)
Temperament_ALEMBERT_ROUSSEAU=d'Alembert-Rousseau Temp\u00e9rament Ordinaire (1752/1767)
Temperament_ARON_NEIDHARDT=Aron-Neidhardt Equal Beating Well Temperament
Temperament_ATOM_SCHISMA=Atom Schisma Scale
Temperament_TET12_MINIMAL_ORDER_17=Equal Temperament Approximation (Minimal Order 17 Beats)
Temperament_BAILEY=Bailey Modern Well Temperament (2002)
Temperament_BARNES=Barnes Well-Tempered Clavier Temperament (1977)
Temperament_BETHISY=B\u00e9thizy Temp\u00e9rament Ordinaire (1754)
Temperament_BIG_GULP=Big Gulp
Temperament_WEDDING_CAKE=Wedding Cake
Temperament_UPSIDE_DOWN_WEDDING_CAKE=Upside-Down Wedding Cake (Divorce Cake)
Temperament_PYTHAGOREAN=Pythagorean Scale
Temperament_SCHNEIDER=Schneider Logarithmic Scale, log(4) to log(16)
Temperament_ZARLINO=Zarlino Temp\u00e9rament Extraordinaire (Schulter)
Temperament_FOKKER=Fokker 7-Limit Just Scale
Temperament_BACH=Bach Temperament by Sparschuh (A4 = 400 Hz)
Temperament_VALLOTTI_YOUNG=Vallotti Temperament (1754)
Temperament_VALLOTTI_YOUNG_WERCKMEISTER_III=Vallotti-Young/Werckmeister III Lesfip Scale (5-Limit, 10 Cents)
Temperament_CUSTOM=Custom Temperament in Cents
