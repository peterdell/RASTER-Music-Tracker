# The display texts of this package's value sets, keyed <ClassName>_<id>.
# See ValueSets.java and plans/28_VALUE_SETS_PLAN.md.

# Assembler formats (the export dialogs' "Assembler format" combo box)
AssemblerFormat_ATASM=Atasm
AssemblerFormat_XASM=Xasm

# Tracker driver versions (the Options dialog's "RMT Driver Version" combo box).
# NONE and UNPATCHED_WITH_TUNING are not offered there, but are reachable
# through rmt.ini and the script command "set driver".
TrackerDriverVersion_NONE=None
TrackerDriverVersion_UNPATCHED=RMT 1.28 Unpatched by Raster
TrackerDriverVersion_UNPATCHED_WITH_TUNING=RMT 1.28 Unpatched by Raster with tuning
TrackerDriverVersion_PATCH3=RMT 1.25 Patch 3 by Analmux
TrackerDriverVersion_PATCH6=RMT 1.27 Patch 6 by Analmux
TrackerDriverVersion_PATCH8=RMT 1.28 Patch 8 by Analmux
TrackerDriverVersion_PATCH16=RMT 1.28 Patch 16 by VinsCool
TrackerDriverVersion_PATCH_PRINCE_OF_PERSIA=RMT 1.28 Patch Prince of Persia by VinsCool

# Keyboard layouts (the Options dialog's "Keyboard Layout" combo box)
KeyboardLayout_QWERTY=QWERTY Layout
KeyboardLayout_AZERTY=AZERTY Layout
KeyboardLayout_QWERTZ=QWERTZ Layout
