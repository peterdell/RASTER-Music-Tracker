name: Check drivers

# Proves that the shipped driver binaries in rmt/resources/drivers are
# byte for byte what their 6502 sources in asm/ assemble to, using the
# vendored, pinned MADS (lib/mads - see its README.md for why pinned and
# how to update). The check takes seconds, so it runs on every push.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the driver sources and compare with the shipped binaries
        run: |
          chmod +x lib/mads/linux_x86_64/mads
          sh build/check_drivers.sh

      # Assembles asm/Unpatched and asm/Patch-16 with every feature flag of
      # rmt_feat.a65 toggled once and compares the outputs against the
      # checked-in manifest - covers the IFT branches the default
      # configuration leaves unassembled (plans/52_FEAT_MATRIX_PLAN.md).
      - name: Assemble the players with every feature flag toggled once
        run: sh build/check_feat_matrix.sh
