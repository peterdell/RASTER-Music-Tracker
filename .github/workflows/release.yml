name: Release (Java)

# Builds a portable, no-install-needed app image of the Java port via
# jpackage (bundling the JVM, so end users need no Java install of their
# own) and publishes them as assets on a GitHub Release. Same shape as
# dis6502's release workflow; the RMT specifics are the rmt/ distribution
# layout staged next to the jar (see build/stage_java_release.sh) and the
# WUDSN Base dependency built first.
#
# One asset per operating system and processor, named
# rmt-java-<platform>-<arch>: jpackage bundles the runner's own Java
# runtime, so an image runs only on the architecture it was built on.
# There is no cross compilation - each architecture needs its own runner:
#
#   windows  x64      windows-latest
#   windows  aarch64  windows-11-arm
#   linux    x64      ubuntu-latest
#   linux    aarch64  ubuntu-24.04-arm
#   macos    x64      macos-15-intel  (macos-13 was retired; macos-14 is
#                                    deprecated, so 15 is the oldest Intel
#                                    image still offered)
#   macos    aarch64  macos-latest    (Apple Silicon)
#
# macos-latest has been Apple Silicon since 2024, so the macOS asset was
# ARM-only while its name said nothing; it is rmt-java-macos-aarch64 now
# and Intel Macs have their own (2026-10-01).
#
# Trigger: push a tag matching v*, e.g. `git tag v1.36.0 && git push origin v1.36.0`
# (the Java port ships as the same 1.36 line the C++ program is at; the
# version string is also a file-format marker, so it follows RMT_VERSION_STRING).
#
# Can also be run manually (workflow_dispatch):
# - With the release_tag input left empty: a plain test build - no release is
#   published, only build artifacts you can download from the workflow run.
# - With release_tag set to an EXISTING release's tag (e.g. v1.36.0): rebuilds
#   whatever the triggering branch currently is and republishes those binaries
#   to that release, without moving the git tag itself.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and republish assets for (leave empty for a plain test build)"
        required: false
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            icon: RASTER-Music-Tracker/src/cpp/res/application.ico
          - os: windows-11-arm
            platform: windows
            arch: aarch64
            icon: RASTER-Music-Tracker/src/cpp/res/application.ico
          - os: ubuntu-latest
            platform: linux
            arch: x64
            icon: RASTER-Music-Tracker/src/java/org/atari/raster/rmt/ui/application.png
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            icon: RASTER-Music-Tracker/src/java/org/atari/raster/rmt/ui/application.png
          - os: macos-15-intel
            platform: macos
            arch: x64
            icon: ""
          - os: macos-latest
            platform: macos
            arch: aarch64
            icon: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout RASTER Music Tracker
        uses: actions/checkout@v5
        with:
          path: RASTER-Music-Tracker

      - name: Checkout WUDSN-Base
        uses: actions/checkout@v5
        with:
          repository: wudsn/wudsn-base
          path: wudsn-base

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install WUDSN-Base into the local Maven repo
        run: mvn -B -ntp install
        working-directory: wudsn-base

      - name: Build the shaded jar
        # The tests run as part of the build; the one needing a display skips itself headless.
        run: mvn -B -ntp package
        working-directory: RASTER-Music-Tracker

      - name: Stage the distribution layout
        shell: bash
        run: bash RASTER-Music-Tracker/build/stage_java_release.sh stage

      - name: Determine app version
        id: version
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${RELEASE_TAG_INPUT}" ]]; then
            TAG="${RELEASE_TAG_INPUT}"
          fi
          if [[ -n "${TAG:-}" ]]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.36.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build portable app image with jpackage
        shell: bash
        env:
          ICON: ${{ matrix.icon }}
        run: |
          ICON_ARGS=()
          if [[ -n "${ICON}" ]]; then
            ICON_ARGS=(--icon "${ICON}")
          fi
          jpackage \
            --type app-image \
            --name rmt \
            --input stage \
            --main-jar rmt.jar \
            --main-class org.atari.raster.rmt.ui.RmtApplication \
            --app-version "${{ steps.version.outputs.version }}" \
            --description "RASTER Music Tracker (Java port)" \
            --vendor "wudsn.com" \
            --add-modules ALL-MODULE-PATH \
            "${ICON_ARGS[@]}" \
            --dest dist

      - name: Archive app image (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/rmt -DestinationPath rmt-java-windows-${{ matrix.arch }}.zip

      - name: Archive app image (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: tar czf rmt-java-linux-${{ matrix.arch }}.tar.gz -C dist rmt

      - name: Archive app image (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: tar czf rmt-java-macos-${{ matrix.arch }}.tar.gz -C dist rmt.app

      # The artifact name must be unique per job: upload-artifact v4 fails
      # on a name a parallel job already used.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmt-java-${{ matrix.platform }}-${{ matrix.arch }}
          path: rmt-java-${{ matrix.platform }}-${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || github.event.inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${RELEASE_TAG_INPUT}" >> "$GITHUB_OUTPUT"
          fi

      # tag_name targets an existing release/tag when republishing via
      # release_tag - the action updates that release's assets/notes in
      # place rather than creating a new one, and does not move the git tag.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*/*
          generate_release_notes: true
